# DHCP/DNS is bound only to the BOFBench bridge and cannot answer on vmbr0.
interface=vmbr290
bind-dynamic
listen-address=10.12.90.1
port=53
domain-needed
bogus-priv
domain=bofbench.lab
local=/bofbench.lab/
dhcp-authoritative
dhcp-range=10.12.90.100,10.12.90.199,255.255.255.0,12h
dhcp-option=option:router,10.12.90.1
dhcp-option=option:dns-server,10.12.90.1
dhcp-option=option:domain-search,bofbench.lab
dhcp-leasefile=/var/lib/misc/bofbench-vmbr290.leases
