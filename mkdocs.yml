site_name: BOFBench
site_description: Compose, analyze, run, and export BOFs from capability packs
exclude_docs: |
  assets/downloads/
  assets/media/
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Start:
      - Quickstart: quickstart.md
      - Commands: commands.md
  - Build:
      - Capability Packs: packs.md
      - External Catalogs: external-catalogs.md
      - Build and Extend: development.md
      - Generated Pack Reference: pack-reference.md
  - Analyze:
      - Behavioral Analysis: analysis.md
      - Arsenal Intelligence: arsenal.md
      - Loader Internals: native-loader.md
  - Run:
      - Runtime Adapters: runtime.md
      - Windows Lab: windows-lab.md
      - Portable Lab Profiles: lab-profiles.md
      - Lab Architecture: lab-setup.md
      - Sliver: sliver.md
      - Cobalt Strike: cobaltstrike.md
      - Export: staging.md
      - Operator Playbooks: playbooks.md
      - Deep Capability Workflows: deep-capabilities.md
      - Live Capability Proof: live-proof.md
  - Reference:
      - Operator TUI: tui.md
      - Argument Packing: arg-packing.md
      - Reports: evidence.md
      - Release: release.md
      - Troubleshooting: troubleshooting.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
