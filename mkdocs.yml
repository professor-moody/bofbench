site_name: BOFBench
site_description: Compose, analyze, run, and export BOFs from capability packs
exclude_docs: |
  assets/downloads/
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-handbook.js
nav:
  - Home: index.md
  - Start:
      - Install and Verify: installation.md
      - Quickstart: quickstart.md
      - How BOFBench Fits Together: concepts.md
      - Scenario Library: scenarios/index.md
  - Build:
      - Capability Packs: packs.md
      - External Catalogs: external-catalogs.md
      - Author an External Pack: pack-authoring.md
      - Test and Prove Packs: pack-testing.md
      - Author Multi-Step Operations: operations.md
      - Build and Extend BOFs: development.md
      - Argument Packing: arg-packing.md
      - Generated Pack Reference: pack-reference.md
  - Analyze:
      - Read a Capability Report: report-interpretation.md
      - Behavioral Analysis: analysis.md
      - Analyze Third-Party BOFs: third-party-analysis.md
      - Arsenal Intelligence: arsenal.md
      - Loader Internals: native-loader.md
  - Operate:
      - Runtime Adapters: runtime.md
      - Windows Lab: windows-lab.md
      - Portable Lab Profiles: lab-profiles.md
      - Proxmox-Native Labs: proxmox-labs.md
      - Neutral Operator Lab: operator-lab.md
      - Lab Architecture: lab-setup.md
      - Sliver: sliver.md
      - Cobalt Strike: cobaltstrike.md
      - Export: staging.md
      - EDR Lab Bundles: edrlab-export.md
      - Runtime Receipts: evidence.md
      - Operator TUI: tui.md
  - Scenarios:
      - Choose a Scenario: scenarios/index.md
      - First BOF: scenarios/first-bof.md
      - Build Matrix: scenarios/build-matrix.md
      - TrustedSec whoami: scenarios/trustedsec-whoami.md
      - Compare Arbitrary Objects: scenarios/arbitrary-object.md
      - Arsenal Workflow: scenarios/arsenal-workflow.md
      - Arsenal Architecture Matrix: scenarios/arsenal-architecture-matrix.md
      - External Pack: scenarios/external-pack.md
      - Move to Another VM: scenarios/portable-vm.md
      - Compiler-Free Lab: scenarios/compiler-free-lab.md
      - Public Capabilities: scenarios/public-capabilities.md
      - Native and Lab Execution: scenarios/runtime-execution.md
      - Receipts and Observation: scenarios/receipts.md
      - Sliver Sessions and Tasks: scenarios/c2-tasks.md
      - C2 Task Refresh: scenarios/c2-task-refresh.md
      - Export Packages: scenarios/export-packages.md
      - Multi-Host Topologies: scenarios/topologies.md
      - Operator TUI Workflow: scenarios/tui-workflow.md
      - Diagnose a Workflow: scenarios/diagnose-workflow.md
      - Reproducible Handoff: scenarios/release-handoff.md
      - Multi-Step Operation Lifecycle: scenarios/operation-lifecycle.md
      - Adaptive Native Coordination: scenarios/adaptive-native-coordination.md
      - Composable Native IPC: scenarios/composable-native-ipc.md
      - Parallel Native IPC and RPC: scenarios/parallel-native-ipc.md
      - Dependency-Aware IPC: scenarios/dependency-aware-ipc.md
      - Asynchronous Eventing and Cancellation: scenarios/asynchronous-eventing.md
      - Resilient Network Transport and Retry: scenarios/network-transport-retry.md
      - Secure HTTP and BITS Control: scenarios/secure-http-bits.md
      - Fan-Out SMB and NTFS: scenarios/fanout-smb-ntfs.md
      - Proxmox Domain and Sliver Proof: scenarios/proxmox-domain-sliver.md
      - Topology Target Sets: scenarios/topology-target-sets.md
      - Cross-Runtime Analysis v3: scenarios/cross-runtime-analysis-v3.md
      - Operator Playbooks: playbooks.md
      - Deep Capability Workflows: deep-capabilities.md
      - Native Process Depth: native-process-depth.md
      - Operator-Controlled Execution: operator-execution-depth.md
      - Runtime Access and Configuration: runtime-access-depth.md
      - Standalone Remote Operations: remote-operations.md
      - Cross-Host and Domain Topologies: cross-host-domain.md
      - Live Capability Proof: live-proof.md
  - Reference:
      - Commands: commands.md
      - Generated Operation Reference: operation-reference.md
      - Glossary: glossary.md
      - Documentation Conventions: documentation-conventions.md
      - Evidence Fixture Conventions: evidence/README.md
      - Release: release.md
      - Troubleshooting: troubleshooting.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: bb-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
